[build]
  command = "npm run build"
  publish = "dist/devfest-manager/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "dist/devfest-manager/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
